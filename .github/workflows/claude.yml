# Claude Code GitHub Action
#
# Connects this repository to Claude. Once this workflow is on the default
# branch, the Claude GitHub App is installed, and the ANTHROPIC_API_KEY secret
# is set, mention @claude in any issue or pull request comment and Claude will
# respond, make changes, and push commits.
#
# Setup (see the repo README, "Connecting this repo to Claude"):
#   1. Install the Claude GitHub App:  https://github.com/apps/claude
#   2. Add a repository secret named ANTHROPIC_API_KEY (Settings > Secrets and
#      variables > Actions). Using a Claude subscription instead of an API key?
#      Add CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) and change the
#      `anthropic_api_key` line below to:
#        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#   3. Merge this file to the default branch.
#
# Docs: https://code.claude.com/docs/en/github-actions
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only start a runner when the trigger actually mentions @claude. The action
    # re-checks the trigger phrase itself before responding.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # modify repository files
      pull-requests: write   # create PRs and push changes
      issues: write          # respond to issues
      id-token: write        # required for the action's GitHub App authentication
      actions: read          # read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: cap work per run and pick a model.
          # claude_args: "--max-turns 10"
